name = "packages_bench"
version = "0.1.0"
description = "Benchmarks for every gloss package: CPU-bound code paths, and drivers against live services"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
argv = ">= 1.1.0 and < 2.0.0"
gloss = { path = "../../packages/gloss" }
gloss_sql = { path = "../../packages/gloss_sql" }
gloss_sql_pool = { path = "../../packages/gloss_sql_pool" }
gloss_url = { path = "../../packages/gloss_url" }
gloss_pg = { path = "../../packages/gloss_pg" }
gloss_mysql = { path = "../../packages/gloss_mysql" }
gloss_sqlite = { path = "../../packages/gloss_sqlite" }
gloss_redis = { path = "../../packages/gloss_redis" }
gloss_s3 = { path = "../../packages/gloss_s3" }
gloss_sentry = { path = "../../packages/gloss_sentry" }
gloss_otel = { path = "../../packages/gloss_otel" }
