# Postgres for local development. `mise run db` starts it; the credentials
# match the default DATABASE_URL in app/config.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forum
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data in a versioned directory under
      # /var/lib/postgresql, so the volume is mounted there.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forum"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db:
