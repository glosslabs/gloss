name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            packages/gloss,
            packages/gloss_sentry,
            packages/gloss_pg,
            template,
            examples/json_api,
            examples/forum,
          ]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      GLOSS_TEST_PG_URL: postgres://postgres:secret@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gleam
            ${{ matrix.project }}/build/packages
          key: gleam-${{ matrix.project }}-${{ hashFiles(format('{0}/manifest.toml', matrix.project)) }}

      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build --warnings-as-errors
      - run: gleam test
