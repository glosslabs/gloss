name = "gloss_mysql"
version = "0.1.0"
description = "A MySQL driver for gloss/sql, speaking the client/server protocol directly"
licenses = ["MIT"]
internal_modules = ["gloss/mysql/internal/*"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_mysql"

[erlang]
extra_applications = ["crypto", "public_key"]

[dependencies]
gloss = { path = "../gloss" }
gloss_sql = { path = "../gloss_sql" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
