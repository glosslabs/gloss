name = "gloss_pglite"
version = "0.1.0"
description = "PGlite (Postgres in WebAssembly) for gloss/sql, in the browser and other JavaScript runtimes"
licenses = ["MIT"]
target = "javascript"

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_pglite"

[dependencies]
gloss_sql = { path = "../gloss_sql" }
gloss_sql_async = { path = "../gloss_sql_async" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
