name = "gloss_s3"
version = "0.1.0"
description = "An S3 client for gloss: objects, listing, presigned URLs and multipart uploads, signed with AWS Signature Version 4"
licenses = ["MIT"]
internal_modules = ["gloss/s3/internal/*"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_s3"

[erlang]
extra_applications = ["crypto"]

[dependencies]
gloss_url = { path = "../gloss_url" }
gloss = { path = "../gloss" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
