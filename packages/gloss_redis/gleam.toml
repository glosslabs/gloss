name = "gloss_redis"
version = "0.1.0"
description = "A Redis client for gloss, speaking RESP directly: pooled, pipelined, with pub/sub and tracing"
licenses = ["MIT"]
internal_modules = ["gloss/redis/internal/*"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_redis"

[erlang]
extra_applications = ["ssl"]

[dependencies]
gloss = { path = "../gloss" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
