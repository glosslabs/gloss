name = "gloss_sql_pool"
version = "0.1.0"
description = "Run gloss/sql statements on the BEAM through a pool of database connections"
licenses = ["MIT"]
internal_modules = ["gloss/sql/pool/internal/*"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/sql/gloss_sql_pool"

[dependencies]
gloss = { path = "../../gloss" }
gloss_sql = { path = "../gloss_sql" }
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
