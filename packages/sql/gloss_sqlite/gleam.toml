name = "gloss_sqlite"
version = "0.1.0"
description = "A SQLite driver for gloss/sql/pool on the BEAM, built on the esqlite NIF"
licenses = ["MIT"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/sql/gloss_sqlite"

[dependencies]
gloss = { path = "../../gloss" }
gloss_sql = { path = "../gloss_sql" }
gloss_sql_pool = { path = "../gloss_sql_pool" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
esqlite = ">= 0.9.0 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
