name = "gloss_test"
version = "0.1.0"
description = "Test helpers for gloss applications: requests, responses, a browser over server.handle, a WebSocket client, and a test clock and ids"
licenses = ["MIT"]

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_test"

[dependencies]
gloss = { path = "../gloss" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
