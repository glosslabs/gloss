name = "gloss_sql_async"
version = "0.1.0"
description = "Running gloss/sql statements in JavaScript, where every call returns a Promise; shared by the browser drivers"
licenses = ["MIT"]
target = "javascript"

[repository]
type = "github"
user = "glosslabs"
repo = "gloss"
path = "packages/gloss_sql_async"

[dependencies]
gloss_sql = { path = "../gloss_sql" }
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
